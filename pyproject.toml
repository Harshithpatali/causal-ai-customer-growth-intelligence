[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-ai-customer-growth"
version = "1.1.0"
description = "Causal inference, uplift modelling, and marketing experiment analysis using the Hillstrom randomized email experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "plotly>=5.20",
  "streamlit>=1.36",
  "joblib>=1.3",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
