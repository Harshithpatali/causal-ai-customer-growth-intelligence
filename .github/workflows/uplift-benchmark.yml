name: Uplift Meta-Learner Benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Random seed for the stratified holdout
        required: true
        default: "42"
        type: string
      bootstrap:
        description: Paired holdout bootstrap replicates for the primary seed (minimum 100)
        required: true
        default: "1000"
        type: string
      diagnostic_seeds:
        description: Comma-separated seeds for repeated-split stability
        required: true
        default: "21,42,63,84,105"
        type: string
      diagnostic_bootstrap:
        description: Paired bootstrap replicates per diagnostic split (minimum 100)
        required: true
        default: "100"
        type: string

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Run uplift and multi-treatment benchmark
        run: |
          python scripts/run_uplift_benchmark.py \
            --seed "${{ inputs.seed }}" \
            --bootstrap "${{ inputs.bootstrap }}" \
            --output reports/uplift_benchmark.json

      - name: Run repeated-seed stability and diagnostics
        run: |
          python scripts/run_repeated_seed_diagnostics.py \
            --seeds "${{ inputs.diagnostic_seeds }}" \
            --bootstrap "${{ inputs.diagnostic_bootstrap }}" \
            --output reports/repeated_seed_benchmark.json \
            --chart reports/repeated_seed_diagnostics.html

      - name: Run independent spend prediction and conformal evaluation
        run: |
          python scripts/run_spend_prediction.py --seed 42 --alpha 0.10

      - name: Run cross-fitted AIPW, CUPED and power analysis
        run: |
          python scripts/run_advanced_statistics.py --seed 42 --folds 5 --mde 0.005

      - name: Build compact dashboard research summary
        run: |
          python scripts/build_research_summary.py

      - name: Publish dashboard snapshots to the repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish refreshed research analytics snapshot"
          file_pattern: reports/research_summary.json reports/spend_prediction.json reports/advanced_statistics.json

      - name: Upload benchmark, forecasting and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: hillstrom-research-analytics-release
          path: |
            reports/uplift_benchmark.json
            reports/repeated_seed_benchmark.json
            reports/repeated_seed_diagnostics.html
            reports/spend_prediction.json
            reports/advanced_statistics.json
            reports/research_summary.json
            artifacts/spend_forecaster.joblib
          if-no-files-found: error
          retention-days: 30
