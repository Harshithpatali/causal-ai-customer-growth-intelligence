name: Uplift Meta-Learner Benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Random seed for the stratified holdout
        required: true
        default: "42"
        type: string
      bootstrap:
        description: Number of paired holdout bootstrap replicates (minimum 100)
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run uplift and multi-treatment benchmark
        run: |
          python scripts/run_uplift_benchmark.py \
            --seed "${{ inputs.seed }}" \
            --bootstrap "${{ inputs.bootstrap }}" \
            --output reports/uplift_benchmark.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: hillstrom-uplift-benchmark
          path: reports/uplift_benchmark.json
          if-no-files-found: error
          retention-days: 30
