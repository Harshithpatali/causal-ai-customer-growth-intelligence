name: Keep Streamlit demo warm

on:
  schedule:
    # Visit every 4 hours; the offset avoids the busiest top-of-hour window.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-demo-keepalive
  cancel-in-progress: true

jobs:
  visit-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit and wake the Streamlit app
        env:
          STREAMLIT_APP_URL: https://causal-ai-customer-growth-intelligence.streamlit.app/
        run: python scripts/keep_streamlit_awake.py
