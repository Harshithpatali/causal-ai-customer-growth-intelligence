name: Train and persist uplift model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-persist-uplift-model
  cancel-in-progress: false

jobs:
  train-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model and calculate holdout metrics
        run: python scripts/run_pipeline.py

      - name: Write training manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/write_model_manifest.py

      - name: Validate and commit reusable model artifacts
        run: |
          test -s artifacts/uplift_model.joblib
          test -s artifacts/metrics.json
          test -s artifacts/model_manifest.json
          MODEL_SIZE=$(stat -c%s artifacts/uplift_model.joblib)
          if [ "$MODEL_SIZE" -ge 100000000 ]; then
            echo "Model is too large for standard GitHub repository storage."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/uplift_model.joblib artifacts/metrics.json artifacts/model_manifest.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit."
          else
            git commit -m "chore: persist trained uplift model artifacts"
            git push origin HEAD:main
          fi
