name: Data Science CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis and dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py src scripts tests

      - name: Run statistical and modelling tests
        run: pytest -q

      - name: Check dependency consistency
        run: pip check
